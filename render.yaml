services:
  - type: web
    name: runboard-api
    runtime: node
    rootDir: server
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install && npm run build:render
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CROSS_SITE_COOKIES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: runboard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: DEMO_EMAIL
        value: analyst@runboard.dev
      - key: DEMO_PASSWORD
        value: Runboard123!
      - key: DEMO_NAME
        value: Asha Rao

databases:
  - name: runboard-db
    plan: free
